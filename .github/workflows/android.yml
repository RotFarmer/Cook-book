name: Android app

# Builds the APK and publishes it as a GitHub release on every push.
# The installed app looks at the latest release to decide whether to offer an update.
on:
  push:
    branches: [ccr-5e0faff7-tkykao, main]
    paths-ignore:
      - '**.pdf'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # The run number is the version code, so each release is newer than the one before.
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk primal-cookbook.apk
          gh release create "v${{ github.run_number }}" primal-cookbook.apk \
            --title "Primal Cookbook 1.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)" \
            --target "${{ github.sha }}"
