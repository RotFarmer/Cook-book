<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primal Cookbook</title>
<meta name="description" content="Recipes, meal plan, food log, habits and body weight for a raw primal diet.">
<meta name="theme-color" content="#F5F6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141916" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fredoka:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--app-->
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <svg class="mascot" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <path class="m-white" d="M17 2.5c6.5 0 13.5 3.6 14 11.5.5 8-4.500 17-13.500 17.500C8 32 2.500 24.500 2.500 16.500 2.500 8.500 9.500 2.500 17 2.500z"/>
        <circle class="m-yolk" cx="17" cy="17.500" r="8"/>
        <circle class="m-face" cx="14" cy="16.500" r="1.100"/>
        <circle class="m-face" cx="20" cy="16.500" r="1.100"/>
        <path class="m-smile" d="M14.800 19.800c1.300 1.200 3.100 1.200 4.400 0"/>
      </svg>
      <span>Primal Cookbook</span>
    </div>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h8M18 8h2M4 16h2M12 16h8"/><circle cx="15" cy="8" r="2.5"/><circle cx="9" cy="16" r="2.5"/></svg>
    </button>
  </div>
  <div class="wrap">
    <div class="savebar" id="savebar" role="alert" hidden>
      <span>Recent changes are not saved yet. Check your connection.</span>
      <button class="btn small" id="save-retry" type="button">Retry</button>
    </div>
    <div class="savebar note" id="updatebar" role="status" hidden>
      <span id="update-text"></span>
      <button class="btn small primary" id="update-btn" type="button">Update</button>
    </div>
  </div>
</header>
<main id="view" class="wrap view">
  <p class="quiet center boot">Opening your notebook…</p>
</main>
<!--/app-->
<script type="module" src="js/app.js"></script>
</body>
</html>
